{
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "chmod 0666 /dev/binder",
        "chmod 0666 /dev/hwbinder",
        "chmod 0666 /dev/vndbinder",
        "chmod 0666 /dev/ashmem",
        "chown access_token access_token /dev/access_token_id",
        "chmod 0666 /dev/access_token_id",
        "chown hdf_devmgr uhdf_driver /dev/hdf_kevent",
        "chmod 0660 /dev/hdf_kevent",
        "chown system graphics /dev/dri/card0",
        "chmod 0660 /dev/dri/card0",
        "chown system graphics /dev/dri/renderD128",
        "chmod 0660 /dev/dri/renderD128",
        "chown system graphics /dev/galcore",
        "chmod 0660 /dev/galcore",
        "chown system graphics /dev/bpu",
        "chmod 0660 /dev/bpu",
        "chown system graphics /dev/bpu_core0",
        "chmod 0660 /dev/bpu_core0",
        "chown system graphics /dev/bpu_core1",
        "chmod 0660 /dev/bpu_core1"
      ]
    },
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/app/el3 0711 root root",
        "mkdir /data/app/el4 0711 root root",
        "mkdir /data/app/el5 0711 root root",
        "mkdir /data/service/el3 0711 root root",
        "mkdir /data/service/el4 0711 root root",
        "mkdir /data/service/el5 0711 root root",
        "start rdkhm-usb"
      ]
    }
  ],
  "services": [
    {
      "name": "rdkhm-usb",
      "path": ["/rdkhm/busybox", "sh", "/vendor/bin/rdkhm-usb.sh"],
      "uid": "root",
      "gid": ["root", "shell"],
      "once": 1,
      "start-mode": "condition",
      "sandbox": 0
    },
    {
      "name": "rdkhm-accelerator",
      "path": ["/vendor/lib64/rdkhm-accelerator/ld-linux-aarch64.so.1", "--inhibit-cache", "--library-path", "/vendor/lib64/rdkhm-accelerator", "/vendor/lib64/rdkhm-accelerator/accelerator-daemon"],
      "uid": "system",
      "gid": ["system", "graphics"],
      "socket": [{
        "name": "rdkhm_accel",
        "family": "AF_UNIX",
        "type": "SOCK_STREAM",
        "protocol": "default",
        "permissions": "0660",
        "uid": "system",
        "gid": "graphics"
      }],
      "sandbox": 0,
      "start-mode": "boot",
      "secon": "u:r:rdkhm_accel:s0"
    }
  ]
}
