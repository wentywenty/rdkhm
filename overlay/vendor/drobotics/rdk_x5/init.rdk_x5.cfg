{
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "chmod 0666 /dev/binder",
        "chmod 0666 /dev/hwbinder",
        "chmod 0666 /dev/vndbinder",
        "chmod 0666 /dev/ashmem",
        "chown access_token access_token /dev/access_token_id",
        "chmod 0666 /dev/access_token_id",
        "chown hdf_devmgr uhdf_driver /dev/hdf_kevent",
        "chmod 0660 /dev/hdf_kevent",
        "chown system graphics /dev/dri/card0",
        "chmod 0660 /dev/dri/card0",
        "chown system graphics /dev/dri/renderD128",
        "chmod 0660 /dev/dri/renderD128",
        "chown system graphics /dev/galcore",
        "chmod 0660 /dev/galcore",
        "chown system graphics /dev/bpu",
        "chmod 0660 /dev/bpu",
        "chown system graphics /dev/bpu_core0",
        "chmod 0660 /dev/bpu_core0",
        "chown system graphics /dev/bpu_core1",
        "chmod 0660 /dev/bpu_core1"
      ]
    },
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/app/el3 0711 root root",
        "mkdir /data/app/el4 0711 root root",
        "mkdir /data/app/el5 0711 root root",
        "mkdir /data/service/el3 0711 root root",
        "mkdir /data/service/el4 0711 root root",
        "mkdir /data/service/el5 0711 root root",
        "chmod 0666 /dev/fuse",
        "mkdir /mnt/data/100 0711 root root",
        "mkdir /mnt/data/100/media_fuse 0711 root root",
        "mkdir /storage/media/100 0777 root root",
        "mkdir /storage/media/100/local 0777 root root",
        "mkdir /storage/media/100/local/files 0777 root root",
        "mkdir /storage/media/100/local/files/Photo 0777 root root",
        "mkdir /storage/cloud/100 0777 root root",
        "mkdir /storage/cloud/100/files 0777 root root",
        "mkdir /storage/cloud/100/files/Photo 0777 root root",
        "mkdir /storage/cloud/100/files/.thumbs 0777 root root",
        "mkdir /storage/cloud/100/files/.thumbs/Photo 0777 root root",
        "setparam persist.hdc.port 5555",
        "setparam persist.hdc.mode.tcp enable",
        "mkdir /sys/kernel/tracing 0755 root root",
        "mount tracefs tracefs /sys/kernel/tracing",
        "mkdir /sys/kernel/debug 0755 root root",
        "mount debugfs debugfs /sys/kernel/debug",
        "start rdkhm-usb",
        "start rdkhm-gpio",
        "setparam const.security.developermode.state true",
        "setparam persist.hdc.port 5555",
        "setparam persist.hdc.mode.tcp enable",
        "start hdcd"
      ]
    }
  ],
  "services": [
    {
      "name": "rdkhm-usb",
      "path": ["/rdkhm/busybox", "sh", "/vendor/bin/rdkhm-usb.sh"],
      "uid": "root",
      "gid": ["root", "shell"],
      "once": 1,
      "start-mode": "condition",
      "sandbox": 0
    },
    {
      "name": "rdkhm-gpio",
      "path": ["/rdkhm/gpio-daemon", "-f"],
      "uid": "root",
      "gid": ["root"],
      "start-mode": "condition",
      "sandbox": 0,
      "secon": "u:r:rdkhm_gpio:s0"
    },
    {
      "name": "rdkhm-accelerator",
      "path": ["/vendor/lib64/rdkhm-accelerator/ld-linux-aarch64.so.1", "--inhibit-cache", "--library-path", "/vendor/lib64/rdkhm-accelerator", "/vendor/lib64/rdkhm-accelerator/accelerator-daemon"],
      "uid": "system",
      "gid": ["system", "graphics"],
      "socket": [{
        "name": "rdkhm_accel",
        "family": "AF_UNIX",
        "type": "SOCK_STREAM",
        "protocol": "default",
        "permissions": "0660",
        "uid": "system",
        "gid": "graphics"
      }],
      "sandbox": 0,
      "start-mode": "boot",
      "secon": "u:r:rdkhm_accel:s0"
    },
    {
      "name": "rdkhm-serial-shell",
      "path": ["/system/bin/sh", "-c", "exec /system/bin/sh </dev/ttyS0 >/dev/ttyS0 2>&1"],
      "uid": "root",
      "gid": ["root", "shell"],
      "sandbox": 0,
      "start-mode": "boot",
      "once": 1
    },
    {
      "name": "rdkhm-boot-diagnostics",
      "path": ["/rdkhm/busybox", "sh", "/rdkhm/boot-diagnostics.sh"],
      "uid": "root",
      "gid": ["root", "shell"],
      "sandbox": 0,
      "start-mode": "boot",
      "once": 1
    },
    {
      "name": "rdkhm-powermgr-off",
      "path": ["/rdkhm/busybox", "sh", "-c", "sleep 10; /system/bin/service_control stop powermgr; sleep 2; /system/bin/service_control stop powermgr"],
      "uid": "root",
      "gid": ["root"],
      "sandbox": 0,
      "start-mode": "boot",
      "once": 1
    }
  ]
}
